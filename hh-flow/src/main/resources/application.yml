server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:lSZph2RMzXGle72b2Of79cEtRkVZ3PM8lIqNyFDRHE4Fjd+FJwrdBPW/qGc8X9mg}
  expiration: 15m
  refresh-expiration: 7d

spring:
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  
  # JNDI DataSource configuration for WildFly
  datasource:
    jndi-name: java:/PostgresDS
  
  # JPA/Hibernate configuration for WildFly with managed transactions
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    
  # Transaction management - use JTA
  jta:
    log-dir: ${jboss.server.log.dir:./logs}
    enabled: true
  
  sql:
    init:
      mode: always
  
  jackson:
    serialization:
      write-dates-as-timestamps: false

camunda:
  # WildFly WAR + Camunda Standalone: URL должен указывать на Camunda REST, не на сам WAR.
  # Пример: Camunda Run на 8081 → http://localhost:8081/engine-rest
  engine-rest-url: ${CAMUNDA_ENGINE_REST_URL:http://localhost:8081/engine-rest}
  worker-id: hh-flow-worker
  rest-username: ${CAMUNDA_REST_USERNAME:}
  rest-password: ${CAMUNDA_REST_PASSWORD:}
  identity-sync-enabled: ${CAMUNDA_IDENTITY_SYNC_ENABLED:true}
  identity-sync-initial-password: ${CAMUNDA_IDENTITY_SYNC_INITIAL_PASSWORD:password}

demo:
  # Set this to a vacancy ID to force a rollback after notification save.
  # Use -1 to keep the demo rollback disabled.
  rollback-vacancy-id: 2
