services:
  postgres:
    image: postgres:16
    container_name: hh-flow-postgres
    environment:
      POSTGRES_DB: hh_flow
      POSTGRES_USER: hh_user
      POSTGRES_PASSWORD: hh_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hh_user -d hh_flow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  camunda:
    image: camunda/camunda-bpm-platform:run-7.20.0
    container_name: hh-flow-camunda
    command: ["./camunda.sh", "--webapps", "--rest"]
    ports:
      - "8081:8080"
    volumes:
      - ./job_application_from_diagram-executable.bpmn:/camunda/configuration/resources/job_application.bpmn
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/engine-rest/engine >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hh-flow-app
    depends_on:
      postgres:
        condition: service_healthy
      camunda:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hh_flow
      DB_USER: hh_user
      DB_PASSWORD: hh_password
      CAMUNDA_ENGINE_REST_URL: http://camunda:8080/engine-rest
    ports:
      - "8080:8080"

volumes:
  postgres_data:
